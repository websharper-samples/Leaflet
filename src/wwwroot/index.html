<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet · WebSharper</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" type="text/css" href="css/index.css" />
  <script type="text/javascript" src="Scripts/Leaflet.head.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-logo"><i class="fa-solid fa-map-location-dot"></i></span>
        <div class="app-titles">
          <h1>Leaflet</h1>
          <p>Interactive maps with WebSharper</p>
        </div>
      </div>
      <a class="btn btn-ghost" href="https://github.com/websharper-samples/Leaflet" target="_blank" rel="noreferrer">
        <i class="fa-brands fa-github"></i><span>Source</span>
      </a>
    </header>

    <main class="content">
      <section class="card map-card">
        <div class="card-head">
          <div>
            <h2>Budapest, Hungary</h2>
            <p>Hover the map to read the coordinates of the cursor.</p>
          </div>
          <span class="coords">${Coordinates}</span>
        </div>
        <div class="map-body" ws-hole="Map"></div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script type="module" src="Scripts/Leaflet.min.js"></script>
</body>
</html>
